/* workflow badges */
.wfb{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;padding:0 7px;border-radius:4px;white-space:nowrap;border:1px solid currentColor;line-height:18px}
.wfb.v81{color:var(--green);background:var(--green-bg)} .wfb.part{color:var(--amber);background:var(--amber-bg)} .wfb.new{color:var(--blue);background:var(--blue-bg)}
.wfid{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}

/* behind this screen */
.behind{margin-top:36px;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:var(--r);background:var(--panel);padding:12px 16px}
.behind h2{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;gap:8px;align-items:baseline}
.behind h2 .muted{font-weight:400}
.behind ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.behind li{font-size:13px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.behind li a{font-weight:500;text-decoration:none} .behind li a:hover{text-decoration:underline}
.trace{margin-top:10px;border-top:1px solid var(--line-2);padding-top:8px}
.trace h3{font-size:12px;font-weight:500;color:var(--ink-3);margin:0 0 4px}
.trace ol{margin:0;padding-left:18px;font-size:12px;font-family:var(--mono);color:var(--ink-2)}
.trace ol li{display:list-item}

/* workflow lane diagram */
.lanes{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:auto;box-shadow:var(--shadow)}
.lanes .row{display:grid;align-items:stretch;border-bottom:1px solid var(--line-2);min-width:900px}
.lanes .row:last-child{border-bottom:0}
.lanes .hd{background:var(--line-2);border-bottom:1px solid var(--line)}
.lanes .hd div{font-size:11px;font-weight:600;color:var(--ink-2);text-align:center;padding:8px 2px;line-height:1.25}
.lanes .hd div small{display:block;font-weight:400;color:var(--ink-3)}
.lanes .hd div.txt{text-align:left;padding-left:14px}
.lanes .c{position:relative;min-height:36px}
.lanes .c::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--line)}
.lanes .c.ln::after{content:"";position:absolute;top:17px;height:2px;background:var(--ink-3);left:0;right:0}
.lanes .c.ln.from::after{left:50%} .lanes .c.ln.to::after{right:50%}
.lanes .c .nr{position:absolute;left:50%;top:8px;margin-left:-10px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:10.5px;font-weight:600;display:grid;place-items:center;z-index:2}
.lanes .c .hd2{position:absolute;top:12px;width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;z-index:1}
.lanes .c .hd2.r{left:calc(50% - 9px);border-left:9px solid var(--ink-3)}
.lanes .c .hd2.l{left:50%;border-right:9px solid var(--ink-3)}
.lanes .row.sca .c.ln::after{background:var(--accent)}
.lanes .row.sca .c .hd2.r{border-left-color:var(--accent)} .lanes .row.sca .c .hd2.l{border-right-color:var(--accent)}
.lanes .row.sca .c .nr{background:var(--accent);color:#fff}
.lanes .row.fail .c .nr{background:var(--red);color:#fff}
.lanes .row.fail .c.ln::after{background:var(--red)}
.lanes .row.fail .c .hd2.r{border-left-color:var(--red)} .lanes .row.fail .c .hd2.l{border-right-color:var(--red)}
.lanes .t{padding:7px 14px;font-size:13px;border-left:1px solid var(--line-2)}
.lanes .t .api{display:block;font-family:var(--mono);font-size:11.5px;color:var(--blue);margin-top:2px;word-break:break-word}
.lanes .t .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.lanes .t .tg{font-size:11px;font-weight:500;padding:0 6px;border-radius:4px;background:var(--grey-bg);color:var(--ink-2)}
.lanes .t .tg.sca{background:var(--accent-soft);color:var(--accent)} .lanes .t .tg.gap{background:var(--amber-bg);color:var(--amber)} .lanes .t .tg.fail{background:var(--red-bg);color:var(--red)} .lanes .t .tg.rule{background:var(--blue-bg);color:var(--blue)}
.lanes .t .if{display:block;color:var(--red);font-size:12.5px;margin-top:3px}
.lanes .row.grp .t{font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);background:var(--line-2);padding:5px 14px}
.lanes .row.grp .c{background:var(--line-2);min-height:26px}
.lanes .row.grp .c::before{display:none}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--ink-3);margin:8px 0 0}
.legend i{display:inline-block;width:18px;height:2px;background:var(--ink-3);vertical-align:middle;margin-right:6px}
.legend i.sca{background:var(--accent)} .legend i.fail{background:var(--red)}
.legend b{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:10px;margin-right:6px;vertical-align:middle}

/* open questions */
.qs{display:grid;gap:10px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow)}
.q .qh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.q .qh b{font-weight:600}
.q .qh .r{margin-left:auto;display:flex;gap:8px;align-items:baseline}
.q p{margin-top:6px;font-size:13.5px;color:var(--ink-2)}
.q p.prop{color:var(--ink)}
.q p.prop b{color:var(--blue);font-weight:600}

/* tracker */
ol.path{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
ol.path li{flex:1 1 130px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);display:flex;flex-direction:column;gap:2px}
ol.path li b{font-size:13px;font-weight:600}
ol.path li span{font-size:12px;color:var(--ink-3)}
ol.path li.done{background:var(--line-2)} ol.path li.done b{color:var(--ink-2)}
ol.path li.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
ol.path li.next{opacity:.6}
ol.path li.stop{border-color:var(--red)}

/* wizard */
.wiz{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
.wiz ol.steps{list-style:none;margin:0;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:16px}
.wiz ol.steps a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:var(--r-sm);text-decoration:none;font-size:13.5px;color:var(--ink-2)}
.wiz ol.steps a:hover{background:var(--hover)}
.wiz ol.steps a[aria-current=step]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.wiz ol.steps .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11.5px;flex:none;background:var(--panel)}
.wiz ol.steps .ok .n{background:var(--green);color:#fff;border-color:var(--green)}
.whyask{font-size:12.5px;color:var(--ink-3);border-left:2px solid var(--line);padding-left:10px;margin:4px 0 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.grid2 .full{grid-column:1/-1}
.form input,.form select,.form textarea{width:100%}
.form input[type=checkbox],.form input[type=radio]{width:auto}
.form label.inline{display:flex;gap:8px;align-items:flex-start;font-weight:400;color:var(--ink)}
input[type=email],input[type=tel]{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);padding:5px 10px;min-height:32px}
.drop{border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;display:flex;gap:12px;align-items:center;background:var(--panel);margin-bottom:8px}
.drop .what{flex:1;min-width:0}
.drop .what small{display:block;color:var(--ink-3)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;align-items:center}
.actions .l{margin-right:auto}

/* signing box (SCA) */
.signbox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;margin:4px 0 12px}
.signbox b{font-size:13px}
.signbox dl{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;margin:6px 0 0;font-size:13.5px}
.signbox dt{color:var(--ink-3)} .signbox dd{margin:0;font-weight:500;word-break:break-word}
.secret{font-family:var(--mono);font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--line-2);word-break:break-all}
table.matrix td,table.matrix th{text-align:center;white-space:nowrap}
table.matrix td:first-child,table.matrix th:first-child{text-align:left;white-space:normal}
table.matrix .y{color:var(--green);font-weight:600} table.matrix .s{color:var(--accent);font-weight:600} table.matrix .a{color:var(--blue);font-weight:600} table.matrix .no{color:var(--ink-3);opacity:.5}
.chip{display:inline-block;font-size:12px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);white-space:nowrap;line-height:20px}
.fresh{font-size:12px;color:var(--ink-3);font-weight:400}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin-bottom:24px}
.bal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.bal .l{font-size:12.5px;color:var(--ink-3)}
.bal .v{font-size:23px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.bal .s{font-size:12.5px;color:var(--ink-2)}
.bal .actions{justify-content:flex-start;margin-top:auto;padding-top:10px}
.bal.main{border-color:var(--ink-3)}
.toc{columns:2;column-gap:28px}
.toc a{display:flex;gap:8px;align-items:baseline;break-inside:avoid;padding:3px 0;text-decoration:none;font-size:13.5px}
.toc a:hover span.tt{text-decoration:underline}
.card h3{font-size:13.5px;font-weight:600;margin-bottom:6px}
.card + .card{margin-top:12px}
ul.plain{margin:0;padding-left:18px} ul.plain li{padding:2px 0}
.mt{margin-top:12px} .mb{margin-bottom:12px}
.right{margin-left:auto}
@media print{aside,.top .tools,.behind,.noprint{display:none!important}.app{display:block}main{max-width:none;padding:0}.lanes{overflow:visible}section{break-inside:avoid-page}}
@media (max-width:960px){.wiz{grid-template-columns:minmax(0,1fr)}.wiz ol.steps{position:static;display:flex;flex-wrap:wrap}.grid2{grid-template-columns:minmax(0,1fr)}.toc{columns:1}}
@media (max-width:820px){.mswitch{padding:4px;justify-content:center}.mswitch div{display:none}.side-foot .chk span,.side-foot .linkbtn{display:none}}
.form label > .btn{justify-self:start}
/* decisions */
.wfb.amd{color:var(--green);background:var(--panel)}
.lanes .t .tg.dec{background:var(--green-bg);color:var(--green);text-decoration:none}
.lanes .t .tg.dec:hover{text-decoration:underline}
.lanes .t .tg.add{background:var(--grey-bg);color:var(--ink-2);border:1px dashed var(--ink-3)}
.q.decided{border-left:3px solid var(--green)}
.q p.prop b{color:var(--blue)} .q.decided p.prop b{color:var(--green)}
/* merchant types */
.chip.fortype{background:var(--accent-soft);border-color:transparent;color:var(--ink);text-decoration:none;font-weight:500}
.chip.fortype:hover{text-decoration:underline}

<script>
/* Roles, permissions, limits, application status texts and the systems (lanes) behind the merchant portal.
   Part of the intended design: the merchant-portal prototype runs on this file too.
   Values in [brackets] are proposals for the CTO's review; nothing here is agreed yet.
   Role names ONBOARDING_APPLICANT and MERCHANT_ADMIN come from WF02a/WF02b (v8.1); the others are proposed (MP-Q01). */
window.CONFIG = (function () {
  "use strict";

  const ROLES = {
    admin:     { label: "Admin",     code: "MERCHANT_ADMIN",       desc: "Runs the account: people, payout account, keys, everything below." },
    finance:   { label: "Finance",   code: "MERCHANT_FINANCE",     desc: "Money: balances, payouts, statements, refunds and disputes." },
    developer: { label: "Developer", code: "MERCHANT_DEVELOPER",   desc: "Integration: API keys, webhooks, test data. Reads payments." },
    support:   { label: "Support",   code: "MERCHANT_SUPPORT",     desc: "Customer service: finds payments, refunds within a limit, answers disputes." },
    viewer:    { label: "Viewer",    code: "MERCHANT_VIEWER",      desc: "Reads everything except keys. Changes nothing." },
    applicant: { label: "Applicant", code: "ONBOARDING_APPLICANT", desc: "Before activation: fills in and follows the application only (WF02a step 11)." }
  };

  /* roles: who may start it. sca: needs SCA with dynamic linking (WF02a step 22, extended where marked).
     second: who must approve as a second person, and from which amount (merchant-side dual control, MP-Q05). */
  const PERMS = {
    "payments.view":   { label: "See payments and refunds", roles: ["admin", "finance", "developer", "support", "viewer"] },
    "refund.create":   { label: "Refund a payment", roles: ["admin", "finance", "support"], sca: true, second: { roles: ["admin", "finance"], from: 500 }, src: "WF02a 22, WF11 15" },
    "dispute.view":    { label: "See disputes", roles: ["admin", "finance", "support", "viewer"] },
    "dispute.respond": { label: "Escalate or accept a dispute", roles: ["admin", "finance", "support"], sca: true, src: "WF11 15 (money effect), not in WF02a 22 list (MP-Q14)" },
    "funds.view":      { label: "See balances and payouts", roles: ["admin", "finance", "viewer"] },
    "payout.create":   { label: "Pay out now", roles: ["admin", "finance"], sca: true, second: { roles: ["admin", "finance"], from: 10000 }, src: "One-pager S3 item 5" },
    "payout.settings": { label: "Change payout schedule or keep funds", roles: ["admin", "finance"], second: { roles: ["admin"], from: 0 } },
    "payout.account":  { label: "Change payout account", roles: ["admin"], sca: true, second: { roles: ["admin"], from: 0 }, src: "WF02b invariant, WF02a 22" },
    "statements.view": { label: "Statements, invoices and fees", roles: ["admin", "finance", "viewer"] },
    "keys.view":       { label: "See API keys (masked)", roles: ["admin", "developer"] },
    "keys.manage":     { label: "Create, roll or revoke API keys", roles: ["admin", "developer"], sca: true, src: "WF02a 22" },
    "webhooks.manage": { label: "Webhook endpoints and secrets", roles: ["admin", "developer"], sca: true, src: "Proposed: a webhook secret is a key (MP-Q11)" },
    "team.view":       { label: "See team", roles: ["admin", "finance", "developer", "support", "viewer"] },
    "team.manage":     { label: "Invite, change or remove users", roles: ["admin"], sca: true, src: "WF02a 22 (role above threshold)" },
    "business.edit":   { label: "Change business details, people, documents", roles: ["admin"] },
    "closure.request": { label: "Close the account", roles: ["admin"], sca: true, second: { roles: ["admin"], from: 0 } },
    "messages":        { label: "Messages with Paytinno", roles: ["admin", "finance", "developer", "support", "viewer", "applicant"] },
    "application":     { label: "Fill in the application", roles: ["admin", "applicant"] },
    /* added with MP-29 to MP-41 */
    "links.create":    { label: "Create and cancel payment links", roles: ["admin", "finance", "support"], src: "MP-29" },
    "payment.capture": { label: "Capture an authorised payment", roles: ["admin", "finance", "support"], src: "MP-31" },
    "terminals.order": { label: "Order, replace or return terminals", roles: ["admin"], src: "MP-30" },
    "terminals.block": { label: "Block a lost or stolen terminal", roles: ["admin", "finance", "support"], src: "MP-30" },
    "players.payout":  { label: "Approve payouts to players (gambling)", roles: ["admin", "finance"], sca: true, second: { roles: ["admin", "finance"], from: 2000 }, src: "MP-33" },
    "cards.manage":    { label: "See and delete saved cards", roles: ["admin", "support"], src: "MP-39" },
    "wallets.manage":  { label: "Set up Apple Pay and Google Pay", roles: ["admin", "developer"], src: "MP-40" },
    "activity.view":   { label: "See every user's activity", roles: ["admin", "finance"], src: "MP-34 (others see their own)" },
    "requests.create": { label: "Ask for higher limits or new services", roles: ["admin", "finance"], src: "MP-38" },
    "complaints":      { label: "Make a complaint", roles: ["admin", "finance", "developer", "support", "viewer", "applicant"], src: "MP-32" }
  };

  /* limits a role carries by default (mandates in S6, MP-Q05). Admin can lower them per person. */
  const MANDATE = {
    admin:   { refund: 5000, payout: 50000 },
    finance: { refund: 5000, payout: 50000 },
    support: { refund: 100,  payout: 0 }
  };

  /* systems (lanes in the workflow diagrams), CTO architecture v8.1 names */
  const LANES = {
    MER:  ["Merchant", "user"],
    S3:   ["Portal", "S3"],
    S18:  ["Gateway, BFF", "S18"],
    S19:  ["Identity, SCA", "S19"],
    S6:   ["Onboarding", "S6"],
    S4:   ["Admin", "S4"],
    OPS:  ["Paytinno staff", "OPS"],
    S21:  ["Core", "S21, S5"],
    S7:   ["Fees", "S7 M008"],
    S10:  ["BPC", "S10 via A09"],
    S11:  ["IDV, AML", "S11 via A01"],
    S17:  ["Messages", "S17"],
    S13:  ["Reconciliation", "S13"],
    EXT:  ["Outside", "bank, scheme"],
    CH:   ["Card holder", "customer"],
    TMS:  ["Terminal supplier", "devices, TMS"],
    WAL:  ["Apple, Google", "wallets"],
    SHOP: ["Shop platform", "WooCommerce etc."]
  };

  /* the application's status line: fixed portal texts per state (MP-Q09, contract P7: no free text, no tipping off) */
  const APP_STATES = [
    { k: "DRAFT",           label: "Draft",                   text: "Not sent yet. Your answers are saved as you go." },
    { k: "STARTED",         label: "Received",                text: "We have your application." },
    { k: "KYB_PENDING",     label: "Checking documents",      text: "We are checking your company, documents and the people you listed." },
    { k: "INFO_REQUESTED",  label: "We need something",       text: "We need more information from you. See Messages." },
    { k: "MANUAL_REVIEW",   label: "In review",               text: "We are reviewing your application." },
    { k: "UNDERWRITING",    label: "Risk assessment",         text: "We are setting your limits and terms." },
    { k: "AWAITING_DEPOSIT",label: "Waiting for the deposit", text: "Approved. Please transfer the guarantee deposit to start." },
    { k: "PROVISIONING",    label: "Setting up",              text: "Approved. We are setting up your account and keys." },
    { k: "ACTIVE",          label: "Active",                  text: "You can take live payments." },
    { k: "CLOSED_REJECTED", label: "Not approved",            text: "We cannot offer you the service. This decision is final." },
    { k: "WITHDRAWN",       label: "Withdrawn",               text: "You withdrew the application." }
  ];

  const LIMITS = {
    sessionHours: 8, idleMinutes: "[30]", refreshDays: 30, scaMinutes: 5, codeMinutes: 10,
    payoutCutoff: "[14:00 EET]", minPayout: "[€100]", reserveDays: 180, kybHigh: 12, kybStd: 36,
    keyOverlapHours: "[24]", inviteDays: "[7]"
  };

  return { ROLES, PERMS, MANDATE, LANES, APP_STATES, LIMITS };
})();

<script>
/* Merchant portal (S3) workflows: the intended design, for review before the CTO's team builds it.
   This file is the source of truth. docs/ is generated from it (tools/build-docs.ps1); the viewer (index.html) reads it;
   the merchant-portal prototype loads it for its "Behind this screen" panel.

   status: "v81" = in v8.1 as written; "part" = in v8.1 with open gaps; "amended" = in v8.1, every gap closed by a decision
   (listed in amends: the changes v8.1 needs); "new" = not in v8.1, proposed here.
   question: decided: true = the proposed answer is adopted as the design, awaiting sign-off by its owner.
   deps: confirmations needed from outside (BPC, BNB, OraSYS); not design gaps.
   step: [from, to, text, opts]  opts: {api, ref, sla, sca, fail, rule, gap (open), dec (decided by MP-Qnn), added (not in v8.1)}
   group row: ["#", "title"].  from === to means work inside one system.
   lanes: system codes from src/model.js LANES.
   segments: merchant types the workflow is for (SEGMENTS); none means every merchant.
   placement: where a workflow would sit in the portal when the prototype has no screen for it yet (screens: []). */
window.WF = (function () {
  "use strict";
  const list = [];
  const W = (id, o) => list.push(Object.assign({ id }, o));

  /* ================= ACCESS ================= */
  W("MP-01", {
    title: "Register and create a passkey", area: "Access", status: "v81", source: "WF02a steps 1 to 12",
    trigger: "A representative opens the portal for the first time.", object: "PortalUser (S19 realm merchant), person in S6",
    screens: ["register"], lanes: ["MER", "S3", "S18", "S19", "S17", "S6"],
    summary: "No passwords. The person proves an email and a phone, saves a passkey, and gets the applicant role. Company data comes later in the application.",
    steps: [
      ["#", "Register"],
      ["MER", "S3", "Enters business email, mobile number and name, and accepts the portal terms. No company data yet.", { ref: "WF02a 1" }],
      ["S3", "S18", "Sends the registration. Not signed in, behind the I4 rate limit and bot protection.", { api: "POST /v1/portal/users/register {email, phone, name, consentVersion}", sla: "2 s", fail: "429 on rate limit", gap: "v8.1 answers 409 when the email exists. That tells anyone which emails are registered (MP-Q02).", ref: "WF02a 2" }],
      ["S18", "S19", "Creates the user in realm merchant with status PENDING_VERIFICATION.", { fail: "S19 down: 503, nothing is stored", ref: "WF02a 3" }],
      ["S19", "S17", "Sends one code by email and another by SMS. Valid 10 min, 5 attempts, resend at most 3 times an hour.", { sla: "delivery 30 s", ref: "WF02a 4" }],

    steps: [
      ["#", "Incident"],
      ["OPS", "S4", "Incident declared and classified: is it a major ICT incident under DORA, and which services and merchants does it touch?", {}],
      ["S4", "S3", "Banner on every portal page for affected merchants: what does not work, and since when.", {}],
      ["OPS", "OPS", "Status page, hosted outside the main platform, updated every [60] min until resolved.", {}],
      ["S4", "S17", "Notice to affected merchants without undue delay when their money is affected (for example payouts delayed), with what we are doing about it.", { rule: "DORA Art. 19(3)" }],
      ["S4", "S17", "Resolved: final notice with the impact (which payments or payouts) and what we did; a written report for large merchants on request.", {}],
      ["#", "Planned maintenance"],
      ["S4", "S17", "Notice [5] business days before, at a quiet time, and a banner on the day.", {}],
      ["MER", "S3", "The merchant chooses who gets incident emails; anyone can follow the status page.", {}]
    ],
    states: [["", "declared", "INVESTIGATING"], ["INVESTIGATING", "cause found", "IDENTIFIED"], ["IDENTIFIED", "fix in place", "MONITORING"], ["MONITORING", "stable", "RESOLVED"], ["", "announced", "PLANNED"], ["PLANNED", "window starts", "IN_MAINTENANCE"], ["IN_MAINTENANCE", "done", "COMPLETED"]],
    rules: ["Notices never give details that would help an attacker.", "Texts approved by the incident manager; when DORA applies, also by Compliance.", "The status page must work when the platform does not."],
    amends: ["v8.1 incident handling: add notices to merchants for major ICT incidents (DORA Art. 19(3)), a status page outside the platform, portal banners and planned maintenance notices."],
    questions: [
      { id: "MP-Q53", q: "Is the status page public or only for signed-in merchants, and who approves the texts?", prop: "Public, without details on causes; the incident manager approves, and Compliance too when DORA applies.", owner: "COO" }
    ]
  });

  W("MP-38", {
    title: "Ask for higher limits or new services", area: "Business", status: "new",
    source: "WF02b 10 to 12 (underwriting sets limits, MCC and channels); not as a merchant request in v8.1",
    trigger: "A merchant needs a higher limit, a new channel (links, terminals, manual capture, saved cards), new customer countries, or a lower reserve.", object: "Change request (S4 underwriting case)",
    screens: [], placement: "Business: a Limits and services tab with current limits, usage and Ask for a change",
    lanes: ["MER", "S3", "S18", "S4", "OPS", "S6", "S10", "S17"],
    summary: "The merchant sees its limits and how much it has used, and asks for changes. Staff review them like the first underwriting; new terms are accepted like the first offer.",
    steps: [
      ["S4", "S3", "Current limits and usage: monthly volume, largest payment, channels, countries, reserve.", { api: "GET /v1/merchant/limits" }],
      ["S4", "S17", "Warning at [80]% of the monthly limit.", {}],
      ["MER", "S3", "Asks for a change, with a reason and documents (forecast, new contracts, accounts).", {}],
      ["S3", "S18", "Sends it.", { api: "POST /v1/merchant/requests {type, requested, reason, docRefs}" }],
      ["S18", "S4", "Underwriting case; staff may ask for more (MP-07).", { sla: "[3] business days" }],
      ["OPS", "S4", "Decision with the same four-eyes rules as onboarding.", { ref: "WF02b 11" }],
      ["S4", "S10", "Approved: new limits or channels at BPC through A09.", { api: "IF45 via A09" }],
      ["S4", "S6", "Merchant profile updated. If fees or the reserve change, a new offer to accept with SCA, as in MP-08.", {}],
      ["S4", "S17", "Decision notice. A refusal says only that it is not possible now.", {}]
    ],
    states: [["", "asked", "REQUESTED"], ["REQUESTED", "staff start", "IN_REVIEW"], ["IN_REVIEW", "approved", "APPROVED"], ["IN_REVIEW", "new terms needed", "OFFER_SENT"], ["OFFER_SENT", "accepted", "APPROVED"], ["IN_REVIEW", "refused", "DECLINED"]],
    rules: ["Refusals use the same neutral words as onboarding (no tipping off)."],
    amends: ["WF02b underwriting: add re-underwriting on the merchant's request (limits, channels, countries, reserve) with the same four-eyes rules, and new terms accepted like the offer (MP-08)."],
    questions: [
      { id: "MP-Q55", q: "Who decides these requests, and how fast?", prop: "The underwriting team, in [3] business days; four eyes above the same thresholds as onboarding.", owner: "CRO" }
    ]
  });

  /* portal screens a workflow runs on (ids are the prototype's routes: merchant-portal, #/<id>) */
  const SCREENS = {
    register: "Registration", application: "Application", home: "Home", payments: "Payments", payment: "One payment", refunds: "Refunds",
    disputes: "Disputes", dispute: "One dispute", balances: "Balances", payouts: "Payouts", "payout-account": "Payout account",
    statements: "Statements and fees", business: "Business", messages: "Messages", settings: "Settings", developers: "Developers",
    team: "Team", approvals: "Approvals", security: "Security"
  };
  /* merchant types: a workflow with segments applies only to those merchants; without, to every merchant */
  const SEGMENTS = {
    links: ["Selling without a checkout", "Sales by phone, chat, social media, invoice or at events"],
    pos: ["Shops with card terminals", "Card-present sales in shops, cafés and restaurants"],
    later: ["Charging later", "Shops that charge on dispatch, hotels, car rental"],
    gambling: ["Gambling operators", "MCC 7995, licensed by the National Revenue Agency"],
    recurring: ["Subscriptions and saved cards", "Customers who pay again without typing their card"],
    sdk: ["Own checkout", "Merchants with the JS SDK on their own website"],
    platforms: ["Shop platforms", "WooCommerce, OpenCart, CloudCart and similar"]
  };
  const SCOPE = "Whether each merchant type is in year-one scope is still to decide.";
  const SOURCES = [
    "CTO architecture v8.1, 13 Oct 2026: one-page modules and workflows; low-level workflows WF02a, WF02b, WF10, WF11",
    "Module specs (file still v7.1, 2 Oct 2026; its S3 page describes the old bought portal)",
    "PRD WF11 Acquiring v6, V. Tulev, 15 Oct 2026",
    "Admin and merchant portal message spec v0.1, 15 Oct 2026 (paytinno-admin/docs/portal-connector.md)",
    "Merchant portal design boards, 14 Oct 2026 (screens only, no workflows)"
  ];
  const CONTRADICTIONS = [
    "The module spec file is v7.1 and still describes S3 as a portal bought from BPC. v8.1 has the portal built in house; there is no v8.1 S3 page.",
    "WF02a step 26 points to the wrong steps (MP-Q08).",
    "WF02b step 17 says the portal talks only to S18; WF02a has the portal talk to S19 directly through the web SDK (IF05 rows). Both can be true: S19's SDK for the passkey, S18 for everything else. Say so in v8.2.",
    "PRD WF11 and v8.1 WF11 disagree on dispute states, the channel to the schemes and the ledger accounts (MP-Q12). The PRD also uses component names S21a, S21b, S21c that v7.1 dropped.",
    "Chargeback ratio: v8.1 opens an underwriting case above about 1%; Visa VAMP and Mastercard ECP thresholds in the admin are different and still placeholders.",
    "Webhooks: payment events from BPC, dispute events from S17, with different signatures and retries (MP-Q34).",
    "The admin's access.revoke stops every action; WF11 needs dispute answers to keep working (MP-Q38)."
  ];
  const VERSION = "0.1";
  const AREAS = ["Access", "Onboarding", "Payments", "Disputes", "Money", "Developers", "Team", "Business"];
  const STATUS = { v81: ["v81", "In v8.1"], part: ["part", "v8.1 with gaps"], amended: ["amd", "v8.1, gaps closed"], new: ["new", "Proposed"] };
  const byId = id => list.find(w => w.id === id);
  const forScreen = s => list.filter(w => (w.screens || []).includes(s));
  const questions = () => { const out = []; list.forEach(w => (w.questions || []).forEach(q => out.push(Object.assign({ wf: w.id, wfTitle: w.title }, q)))); return out.sort((a, b) => parseFloat(a.id.slice(4)) - parseFloat(b.id.slice(4))); };
  list.sort((a, b) => AREAS.indexOf(a.area) - AREAS.indexOf(b.area) || a.id.localeCompare(b.id));
  const forSegment = k => list.filter(w => (w.segments || []).includes(k));
  return { list, AREAS, STATUS, SCREENS, SEGMENTS, SCOPE, SOURCES, CONTRADICTIONS, VERSION, byId, forScreen, forSegment, questions };
})();

</script>
<script>
/* Viewer for the workflow catalogue: list, one workflow with its lane diagram, open questions, roles and rights,
   sources, and a full spec to print. Reads src/workflows.js (WF) and src/model.js (CONFIG). No build step. */
(function () {
  "use strict";
  const PORTAL = "http://localhost:8771/#/";   // the merchant-portal prototype, for "Portal screens" links
  const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const eur = n => new Intl.NumberFormat("en-GB", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n);
  const st = (cls, t) => '<span class="st ' + cls + '">' + esc(t) + "</span>";
  const wfb = s => { const x = WF.STATUS[s] || ["", s]; return '<span class="wfb ' + x[0] + '">' + esc(x[1]) + "</span>"; };
  const strip = items => '<div class="strip">' + items.map(([l, v, cls]) => '<div><div class="l">' + esc(l) + '</div><div class="v ' + (cls || "") + '">' + v + "</div></div>").join("") + "</div>";
  function table(cols, rows, opts) {
    opts = opts || {};
    if (!rows.length) return '<p class="empty">' + esc(opts.empty || "Nothing here.") + "</p>";
    return '<div class="tw"><table' + (opts.cls ? ' class="' + opts.cls + '"' : "") + "><thead><tr>" + cols.map(c => "<th" + (c.r ? ' class="r"' : "") + ">" + esc(c.h) + "</th>").join("") + "</tr></thead><tbody>" +
      rows.map(r => "<tr" + (opts.href ? ' class="click" data-href="' + esc(opts.href(r)) + '"' : "") + ">" + cols.map(c => "<td" + (c.r ? ' class="r"' : "") + ">" + c.v(r) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
  }
  const ICON = {
    workflows: '<rect x="3" y="4" width="6" height="5" rx="1"/><rect x="15" y="4" width="6" height="5" rx="1"/><rect x="9" y="15" width="6" height="5" rx="1"/><path d="M6 9v3h12V9M12 12v3"/>',
    questions: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/>',
    roles: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/>',
    sources: '<path d="M4 5h7v15H4zM13 5h7v15h-7z"/>',
    changes: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
    types: '<path d="M4 6h16M4 12h10M4 18h6"/><circle cx="18" cy="16" r="3"/>',
    spec: '<path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6"/>',
    portal: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>'
  };
  const icon = k => '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICON[k] || "") + "</svg>";

  function lanesOf(w) {
    const ids = w.lanes.slice();
    w.steps.forEach(s => { if (s[0] !== "#") [s[0], s[1]].forEach(l => { if (!ids.includes(l)) ids.push(l); }); });
    return ids;
  }

  /* lane diagram: one column per system, one row per step, an arrow from sender to receiver */
  function diagram(w) {
    const L = lanesOf(w); const cols = "grid-template-columns:repeat(" + L.length + ",minmax(62px,78px)) minmax(320px,1fr)";
    let n = 0;
    const head = '<div class="row hd" style="' + cols + '">' + L.map(l => "<div>" + esc(CONFIG.LANES[l][0]) + "<small>" + esc(CONFIG.LANES[l][1]) + "</small></div>").join("") + '<div class="txt">Step</div></div>';
    const rows = w.steps.map(s => {
      if (s[0] === "#") return '<div class="row grp" style="' + cols + '">' + L.map(() => '<div class="c"></div>').join("") + '<div class="t">' + esc(s[1]) + "</div></div>";
      n++; const [from, to, text, o] = [s[0], s[1], s[2], s[3] || {}];
      const i = L.indexOf(from), j = L.indexOf(to); const lo = Math.min(i, j), hi = Math.max(i, j);
      const cells = L.map((_, k) => {
        if (i === j) return '<div class="c">' + (k === i ? '<span class="nr">' + n + "</span>" : "") + "</div>";
        let cls = "c"; let inner = "";
        if (k >= lo && k <= hi) cls += " ln" + (k === lo ? " from" : "") + (k === hi ? " to" : "");
        if (k === i) inner += '<span class="nr">' + n + "</span>";
        if (k === j) inner += '<span class="hd2 ' + (j > i ? "r" : "l") + '"></span>';
        return '<div class="' + cls + '">' + inner + "</div>";
      }).join("");
      const tags = [];
      if (o.ref) tags.push('<span class="tg">' + esc(o.ref) + "</span>");
      if (o.sla) tags.push('<span class="tg">' + esc(o.sla) + "</span>");
      if (o.sca) tags.push('<span class="tg sca">SCA</span>');
      if (o.rule) tags.push('<span class="tg rule">' + esc(o.rule) + "</span>");
      if (o.added) tags.push('<span class="tg add">Added to v8.1</span>');
      if (o.dec) tags.push('<a class="tg dec" href="#/questions?s=decided&q=' + esc(o.dec) + '">Decided: ' + esc(o.dec) + "</a>");
      return '<div class="row' + (o.sca ? " sca" : "") + '" style="' + cols + '">' + cells + '<div class="t">' + esc(text) + (o.api ? '<span class="api">' + esc(o.api) + "</span>" : "") +
        (o.fail ? '<span class="if">If it fails: ' + esc(o.fail) + "</span>" : "") +
        (o.gap ? '<span class="if" style="color:var(--amber)">Gap: ' + esc(o.gap) + "</span>" : "") +
        (tags.length ? '<span class="tags">' + tags.join("") + "</span>" : "") + "</div></div>";
    }).join("");
    return '<div class="lanes">' + head + rows + '</div><div class="legend"><span><b>1</b>step, starts at the sender</span><span><i></i>call or message</span><span><i class="sca"></i>signed with SCA</span><span style="color:var(--red)">If it fails</span><span style="color:var(--amber)">Open gap in v8.1</span><span style="color:var(--green)">Decided (closes a gap)</span></div>';
  }

  function qcard(q, withWf) {
    const d = !!q.decided;
    return '<div class="q' + (d ? " decided" : "") + '" id="' + esc(q.id) + '"><div class="qh"><b>' + esc(q.id) + "</b><span>" + esc(q.q) + '</span><span class="r">' + (d ? st("green", "Decided") + '<span class="chip">Sign-off: ' + esc(q.owner) + "</span>" : '<span class="chip">' + esc(q.owner) + "</span>") + (withWf ? '<a class="wfid" href="#/workflow/' + q.wf + '">' + q.wf + "</a>" : "") + '</span></div><p class="prop"><b>' + (d ? "Decision:" : "Proposed:") + "</b> " + esc(q.prop) + "</p></div>";
  }
  const listBox = (title, items, note) => items && items.length ? "<section><h2>" + esc(title) + "</h2>" + (note ? '<p class="small muted mb">' + esc(note) + "</p>" : "") + '<ul class="list">' + items.map(t => '<li><span class="what">' + esc(t) + "</span></li>").join("") + "</ul></section>" : "";

  /* which merchants a workflow is for: every merchant, or only some merchant types */
  function forTypes(w, long) {
    const s = w.segments || [];
    if (!s.length) return long ? "Every merchant" : "";
    return s.map(k => '<a class="chip fortype" href="#/types" title="' + esc(WF.SEGMENTS[k][1]) + '">Only: ' + esc(WF.SEGMENTS[k][0]) + "</a>").join(" ") + (long ? '<span class="sub">' + esc(s.map(k => WF.SEGMENTS[k][1]).join("; ")) + ". " + esc(WF.SCOPE) + "</span>" : "");
  }

  function detail(w, print) {
    const screens = (w.screens || []).map(s => '<a class="chip" href="' + PORTAL + s + '" target="_blank" rel="noopener">' + esc(WF.SCREENS[s] || s) + "</a>").join(" ");
    const where = screens ? screens + (print ? "" : ' <span class="small muted">open in the prototype</span>') : "Not in the prototype yet." + (w.placement ? '<span class="sub">Would sit on: ' + esc(w.placement) + "</span>" : "");
    return '<dl class="facts mb"><dt>Status</dt><dd>' + wfb(w.status) + "</dd><dt>For</dt><dd>" + forTypes(w, true) + "</dd><dt>Area</dt><dd>" + esc(w.area) + "</dd><dt>Source</dt><dd>" + esc(w.source) + "</dd><dt>Starts when</dt><dd>" + esc(w.trigger) + "</dd><dt>Object</dt><dd>" + esc(w.object) + "</dd><dt>Portal screens</dt><dd>" + where + "</dd></dl>" +
      "<section><h2>Steps</h2>" + diagram(w) + "</section>" +
      '<div class="cols"><section><h2>States</h2>' + (w.states.length ? table([{ h: "From", v: s => '<span class="mono">' + esc(s[0] || "start") + "</span>" }, { h: "When", v: s => esc(s[1]) }, { h: "To", v: s => '<span class="mono">' + esc(s[2]) + "</span>" }], w.states) : '<p class="empty">No states of its own.</p>') + "</section>" +
      "<section><h2>Rules</h2>" + (w.rules.length ? '<ul class="list">' + w.rules.map(r => '<li><span class="what">' + esc(r) + "</span></li>").join("") + "</ul>" : '<p class="empty">None.</p>') + "</section></div>" +
      listBox("Changes v8.1 needs", w.amends, "For the CTO's next version of the architecture (v8.2).") +
      listBox("Depends on", w.deps, "Confirmations needed from outside Paytinno. Not design gaps.") +
      "<section><h2>Open questions</h2>" + (w.questions.length ? '<div class="qs">' + w.questions.map(q => qcard(Object.assign({ wf: w.id }, q))).join("") + "</div>" : '<p class="empty">None.</p>') + "</section>";
  }

  const pages = {};
  pages.workflows = {
    nav: "Workflows", icon: "workflows", title: "Merchant portal workflows",
    render() {
      const all = WF.list; const qs = WF.questions().filter(x => !x.decided);
      const used = Object.keys(WF.STATUS).filter(k => all.some(w => w.status === k));
      return {
        sub: "The intended workflows behind the Paytinno merchant portal (S3), for review with the CTO's team before build. Each says what the merchant does, which systems take part, what each call is, and what is still open. The badge on each row says how it relates to the CTO's architecture v8.1.",
        tools: '<a class="btn" href="#/spec">Full spec to print</a>',
        html: strip([["Workflows", String(all.length)]].concat(used.map(k => [WF.STATUS[k][1], String(all.filter(w => w.status === k).length), k === "part" ? "amber" : ""])).concat([["Open questions", String(qs.length), "amber"], ["Decided, awaiting sign-off", String(WF.questions().length - qs.length)]])) +
          '<p class="small muted mb">' + used.map(k => wfb(k) + " " + esc({ v81: "as v8.1 writes it", part: "in v8.1, gaps still open", amended: "in v8.1, every gap closed by a decision", new: "not in v8.1, needs the CTO team's agreement" }[k])).join("&nbsp;&nbsp; ") + "</p>" +
          WF.AREAS.map(a => { const ws = all.filter(w => w.area === a); if (!ws.length) return ""; return "<section><h2>" + esc(a) + "</h2>" + table([
            { h: "ID", v: w => '<span class="wfid">' + w.id + "</span>" },
            { h: "Workflow", v: w => '<a href="#/workflow/' + w.id + '">' + esc(w.title) + "</a>" + ((w.segments || []).length ? " " + forTypes(w) : "") + '<span class="sub">' + esc(w.summary) + "</span>" },
            { h: "Status", v: w => wfb(w.status) },
            { h: "Source", v: w => '<span class="small">' + esc(w.source) + "</span>" },
            { h: "Steps", r: 1, v: w => String(w.steps.filter(s => s[0] !== "#").length) },
            { h: "Questions", r: 1, v: w => { const o = w.questions.filter(x => !x.decided).length, d = w.questions.length - o; return (o ? '<span class="warn">' + o + " open</span>" : d ? "" : "None") + (d ? '<span class="sub">' + d + " decided</span>" : ""); } }
          ], ws, { href: w => "#/workflow/" + w.id }) + "</section>"; }).join("") +
          '<section><h2>Systems in the diagrams</h2><div class="card small">' + Object.entries(CONFIG.LANES).map(([, v]) => "<b>" + esc(v[0]) + "</b> " + esc(v[1])).join(". ") + ". A01 and A05 are client libraries in S18 and S6; A09 is the BPC API library, which never writes the ledger.</div></section>"
      };
    }
  };
  pages.workflow = {
    nav: "Workflow", parent: "workflows", title: "Workflow",
    render(params) {
      const w = WF.byId(params[0]); if (!w) return { html: '<p class="empty">Not found.</p>' };
      const i = WF.list.indexOf(w); const prev = WF.list[i - 1], next = WF.list[i + 1];
      return {
        title: w.id + " " + w.title, sub: esc(w.summary),
        tools: (prev ? '<a class="btn" href="#/workflow/' + prev.id + '" title="' + esc(prev.title) + '">Previous</a>' : "") + (next ? '<a class="btn" href="#/workflow/' + next.id + '" title="' + esc(next.title) + '">Next</a>' : "") + '<a class="btn" href="#/workflows">All workflows</a>',
        html: detail(w)
      };
    }
  };
  pages.questions = {
    nav: "Open questions", icon: "questions", title: "Open questions",
    badge: () => WF.questions().filter(x => !x.decided).length,
    render(_, q) {
      const s = q.get("s") || "open", own = q.get("o") || "", jump = q.get("q");
      const all = WF.questions(); const inS = x => s === "all" || (s === "decided" ? !!x.decided : !x.decided);
      const owners = [...new Set(all.filter(inS).map(x => x.owner))].sort();
      const rows = all.filter(x => inS(x) && (!own || x.owner === own));
      const link = (k, v) => { const n = new URLSearchParams(q); n.delete("q"); if (v) n.set(k, v); else n.delete(k); if (k === "s") n.delete("o"); return "#/questions?" + n.toString(); };
      return {
        sub: s === "decided" ? "Answers adopted as the design. Each still needs sign-off by its owner, who can change it; tell Claude and the workflows are updated." : "Decisions the portal still needs. Each has a proposed answer to agree or change. CTO question numbers refer to the v8.1 question list.",
        html: '<div class="tabs">' + [["open", "Open"], ["decided", "Decided, awaiting sign-off"], ["all", "All"]].map(([k, l]) => '<a href="' + link("s", k === "open" ? "" : k) + '"' + (s === k ? ' aria-current="page"' : "") + ">" + l + "<span>" + all.filter(x => k === "all" || (k === "decided" ? !!x.decided : !x.decided)).length + "</span></a>").join("") + "</div>" +
          '<div class="flt"><span class="small muted">Owner</span>' + [""].concat(owners).map(o => '<a class="chip" href="' + link("o", o) + '"' + (own === o ? ' style="border-color:var(--accent);color:var(--ink)"' : "") + ">" + esc(o || "Everyone") + "</a>").join(" ") + "</div>" +
          (rows.length ? '<div class="qs">' + rows.map(x => qcard(x, true)).join("") + "</div>" : '<p class="empty">None.</p>'),
        after() { if (jump) { const el = document.getElementById(jump); if (el) { el.scrollIntoView(); el.style.boxShadow = "0 0 0 2px var(--accent)"; } } }
      };
    }
  };
  pages.changes = {
    nav: "Changes to v8.1", icon: "changes", title: "Changes to v8.1",
    badge: () => WF.list.reduce((n, w) => n + (w.amends || []).length, 0),
    render() {
      const ws = WF.list.filter(w => (w.amends || []).length || (w.deps || []).length);
      const deps = []; WF.list.forEach(w => (w.deps || []).forEach(d => deps.push([w, d])));
      return {
        sub: "What the CTO's architecture needs to change (v8.2) so it matches the decided workflows. Each line names the v8.1 workflow or step and the decision behind it.",
        html: ws.map(w => (w.amends || []).length ? '<section><h2><a href="#/workflow/' + w.id + '">' + w.id + " " + esc(w.title) + "</a> " + wfb(w.status) + '</h2><ul class="list">' + w.amends.map(t => '<li><span class="what">' + esc(t) + "</span></li>").join("") + "</ul></section>" : "").join("") +
          (deps.length ? '<section><h2>Depends on</h2><p class="small muted mb">Confirmations needed from outside Paytinno.</p><ul class="list">' + deps.map(([w, d]) => '<li><span class="what">' + esc(d) + '</span><a class="wfid" href="#/workflow/' + w.id + '">' + w.id + "</a></li>").join("") + "</ul></section>" : "")
      };
    }
  };
  pages.roles = {
    nav: "Roles and rights", icon: "roles", title: "Roles and rights",
    render() {
      const R = Object.keys(CONFIG.ROLES);
      const cell = (p, r) => { if (!p.roles.includes(r)) return '<span class="no">No</span>'; let t = '<span class="y">Yes</span>'; if (p.sca) t += ' <span class="s">SCA</span>'; if (p.second) t += ' <span class="a">' + (p.second.from ? "2nd from " + eur(p.second.from) : "2nd") + "</span>"; return t; };
      const L = CONFIG.LIMITS;
      return {
        sub: "Proposed (MP-Q01). v8.1 names only ONBOARDING_APPLICANT and MERCHANT_ADMIN. Roles live in S6; S18 checks them on every call. The screens hide what a role cannot do, but S18 is the control.",
        html: '<section><h2>Who can do what</h2>' + table([{ h: "Action", v: x => esc(x[1].label) + '<span class="sub mono">' + esc(x[0]) + "</span>" + (x[1].src ? '<span class="sub">' + esc(x[1].src) + "</span>" : "") }].concat(R.map(r => ({ h: CONFIG.ROLES[r].label, v: x => cell(x[1], r) }))), Object.entries(CONFIG.PERMS), { cls: "matrix" }) + '<p class="note"><span class="s">SCA</span> the person signs with a passkey (dynamic linking). <span class="a">2nd</span> a second person approves (MP-23), always or from the amount shown.</p></section>' +
          '<div class="cols"><section><h2>Roles</h2>' + table([{ h: "Role", v: r => "<b>" + esc(CONFIG.ROLES[r].label) + '</b><span class="sub mono">' + CONFIG.ROLES[r].code + "</span>" }, { h: "For", v: r => esc(CONFIG.ROLES[r].desc) }], R) + "</section>" +
          "<section><h2>Default limits per person</h2>" + table([{ h: "Role", v: r => esc(CONFIG.ROLES[r].label) }, { h: "Refund", r: 1, v: r => eur(CONFIG.MANDATE[r].refund) }, { h: "Payout", r: 1, v: r => CONFIG.MANDATE[r].payout ? eur(CONFIG.MANDATE[r].payout) : "None" }], Object.keys(CONFIG.MANDATE)) + '<p class="note">An admin can lower a person\'s limit. Paytinno sets the business\'s maximum in underwriting (MP-Q05).</p>' +
          '<h2 style="font-size:14px;margin:18px 0 10px">Timers and limits</h2><dl class="facts">' + [["Session", L.sessionHours + " h, idle " + L.idleMinutes + " min"], ["Refresh token", L.refreshDays + " days"], ["SCA challenge", L.scaMinutes + " min"], ["Verification codes", L.codeMinutes + " min, 5 attempts"], ["Payout cut-off", L.payoutCutoff], ["Minimum payout", L.minPayout], ["Reserve", L.reserveDays + " days"], ["KYB review", L.kybHigh + " months high risk, " + L.kybStd + " others"], ["Old key after roll", L.keyOverlapHours + " h"], ["Invitation", L.inviteDays + " days"]].map(([a, b]) => "<dt>" + esc(a) + "</dt><dd>" + esc(b) + "</dd>").join("") + '</dl><p class="note">Values in [brackets] are proposals.</p></section></div>' +
          '<section><h2>Application status texts</h2><p class="small muted mb">The portal shows its own fixed text for each state, never free text from staff (MP-Q09, no tipping off).</p>' + table([{ h: "State", v: s => '<span class="mono">' + s.k + "</span>" }, { h: "Label", v: s => esc(s.label) }, { h: "Text", v: s => esc(s.text) }], CONFIG.APP_STATES) + "</section>"
      };
    }
  };
  pages.sources = {
    nav: "Sources", icon: "sources", title: "Sources and contradictions",
    render() {
      return {
        sub: "What the workflows are built from, and where those sources disagree.",
        html: '<section><h2>Sources</h2><ul class="list">' + WF.SOURCES.map(s => '<li><span class="what">' + esc(s) + "</span></li>").join("") + "</ul></section>" +
          '<section><h2>Contradictions found in the sources</h2><ul class="list">' + WF.CONTRADICTIONS.map(s => '<li><span class="what">' + esc(s) + "</span></li>").join("") + "</ul></section>"
      };
    }
  };
  pages.spec = {
    nav: "Full spec", icon: "spec", title: "Merchant portal workflows",
    render() {
      const qs = WF.questions();
      return {
        sub: "Paytinno merchant portal (S3): workflows for review, version " + WF.VERSION + ". Based on CTO architecture v8.1, PRD WF11 Acquiring v6 and the admin-portal message spec v0.1.",
        tools: '<button class="btn primary" type="button" onclick="window.print()">Print or save as PDF</button>',
        html: '<section><h2>Contents</h2><div class="toc card">' + WF.list.map(w => '<a href="#/spec" data-go="' + w.id + '"><span class="wfid">' + w.id + '</span><span class="tt">' + esc(w.title) + "</span> " + wfb(w.status) + "</a>").join("") + "</div></section>" +
          WF.list.map(w => '<section id="s-' + w.id + '" style="margin-top:36px"><h2 style="font-size:17px">' + w.id + " " + esc(w.title) + '</h2><p class="mb">' + esc(w.summary) + "</p>" + detail(w, true) + "</section>").join("") +
          '<section style="margin-top:36px"><h2 style="font-size:17px">Open questions (' + qs.filter(x => !x.decided).length + ')</h2><div class="qs">' + qs.filter(x => !x.decided).map(x => qcard(x, true)).join("") + "</div></section>" +
          '<section style="margin-top:36px"><h2 style="font-size:17px">Decided, awaiting sign-off (' + qs.filter(x => x.decided).length + ')</h2><div class="qs">' + qs.filter(x => x.decided).map(x => qcard(x, true)).join("") + "</div></section>" +
          '<section style="margin-top:36px"><h2 style="font-size:17px">Changes v8.1 needs</h2>' + WF.list.filter(w => (w.amends || []).length).map(w => "<h3 style=\"font-size:14px;margin:14px 0 6px\">" + w.id + " " + esc(w.title) + "</h3><ul class=\"plain\">" + w.amends.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul>").join("") + "</section>",
        after(root) { root.querySelectorAll("[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById("s-" + a.dataset.go).scrollIntoView(); }); }
      };
    }
  };

  pages.types = {
    nav: "Merchant types", icon: "types", title: "Merchant types",
    render() {
      const keys = Object.keys(WF.SEGMENTS); const every = WF.list.filter(w => !(w.segments || []).length);
      return {
        sub: "Most workflows apply to every merchant. Some are only needed for certain kinds of merchant. " + esc(WF.SCOPE) + " A type left out of scope drops its workflows from the build.",
        html: table([
          { h: "Merchant type", v: k => "<b>" + esc(WF.SEGMENTS[k][0]) + '</b><span class="sub">' + esc(WF.SEGMENTS[k][1]) + "</span>" },
          { h: "Workflows only for them", v: k => WF.forSegment(k).map(w => '<a href="#/workflow/' + w.id + '"><span class="wfid">' + w.id + "</span> " + esc(w.title) + "</a>").join("<br>") },
          { h: "Year-one scope", v: () => st("amber", "To decide") }
        ], keys) +
          '<p class="note">' + every.length + " of " + WF.list.length + " workflows apply to every merchant.</p>"
      };
    }
  };

  const NAV = ["workflows", "questions", "changes", "types", "roles", "sources", "spec"];
  let current = null;
  function render() {
    const h = location.hash.replace(/^#\/?/, "") || "workflows";
    const [path, query] = h.split("?"); const parts = path.split("/").map(decodeURIComponent);
    const id = pages[parts[0]] ? parts[0] : "workflows"; const page = pages[id];
    let out; try { out = page.render(parts.slice(1), new URLSearchParams(query || "")) || {}; } catch (e) { console.error(e); out = { html: '<p class="bad">This page could not be drawn: ' + esc(e.message) + "</p>" }; }
    document.getElementById("pageTitle").textContent = out.title || page.title;
    document.getElementById("pageSub").innerHTML = out.sub || ""; document.getElementById("pageSub").classList.toggle("hide", !out.sub);
    document.getElementById("pageTools").innerHTML = out.tools || "";
    document.getElementById("envTag").innerHTML = '<span class="tag" style="background:var(--blue-bg);color:var(--blue)">Draft ' + esc(WF.VERSION) + "</span>";
    document.getElementById("main").innerHTML = out.html || "";
    document.title = (out.title || page.title) + " - Paytinno";
    if (out.after) out.after(document.querySelector("main"));
    const parent = page.parent || id;
    document.getElementById("nav").innerHTML = NAV.map(k => { const p = pages[k]; const b = p.badge ? p.badge() : null; return '<a href="#/' + k + '" title="' + esc(p.nav) + '" aria-label="' + esc(p.nav) + '"' + (parent === k ? ' aria-current="page"' : "") + '><span class="ico">' + icon(p.icon) + "</span>" + esc(p.nav) + (b ? '<span class="n">' + b + "</span>" : "") + "</a>"; }).join("") +
      '<div class="grp">Prototype</div><a href="' + PORTAL + 'home" target="_blank" rel="noopener" title="Merchant portal prototype" aria-label="Merchant portal prototype"><span class="ico">' + icon("portal") + "</span>Merchant portal</a>";
    window.scrollTo(0, current === location.hash ? window.scrollY : 0); current = location.hash;
  }
  function setLook(look, save) {
    const el = document.documentElement;
    if (look === "light") { el.dataset.look = "light"; el.dataset.theme = "light"; } else { delete el.dataset.look; if (el.dataset.theme === "light") delete el.dataset.theme; }
    document.querySelectorAll(".envtoggle button[data-look]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.look === look)));
    if (save) try { localStorage.setItem("mpw.look", look); } catch (e) { /* private window */ }
  }
  setLook(document.documentElement.dataset.look || "standard");
  document.querySelectorAll(".envtoggle button[data-look]").forEach(b => b.onclick = () => setLook(b.dataset.look, true));
  document.addEventListener("click", e => { const tr = e.target.closest("tr[data-href]"); if (tr && !e.target.closest("a,button")) location.hash = tr.dataset.href; });
  window.addEventListener("hashchange", render);
  render();
})();

</script>
</body>
</html>
